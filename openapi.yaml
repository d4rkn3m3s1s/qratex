openapi: 3.0.3
info:
  title: QRATEX API
  description: |
    QRATEX müşteri deneyimi ve geri bildirim API'si.
    Çoğu endpoint oturum (session cookie) gerektirir; Bearer token bazı entegrasyonlarda kullanılabilir.
  version: 1.0.0

servers:
  - url: /
    description: Uygulama kökü (relative path)

paths:
  /api/health:
    get:
      summary: Sağlık / readiness kontrolü
      description: |
        Uygulama ve veritabanı durumu. Load balancer veya kube probe için kullanılabilir.
        - `?light=1` → Sadece DB ping, minimal yanıt (readiness).
        - Parametresiz → Tam health (timestamp, checks, version).
      parameters:
        - name: light
          in: query
          required: false
          schema: { type: string, enum: ['1'] }
          description: "1 ise sadece DB ping; yanıt { status, latencyMs } veya { status, error }"
      responses:
        '200':
          description: OK (DB erişilebilir)
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [status, latencyMs]
                    properties: { status: { type: string, example: ok }, latencyMs: { type: number } }
                  - type: object
                    required: [status, timestamp, checks, version]
                    properties:
                      status: { type: string, example: healthy }
                      timestamp: { type: string, format: date-time }
                      checks: { type: object }
                      version: { type: string }
        '503':
          description: Service Unavailable (DB veya uygulama hatası)
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string }, error: { type: string } }

  /api/qr-codes/public/{code}:
    get:
      summary: QR kod public bilgisi
      description: QR kod ile ilişkili işletme ve kod bilgisi (public, rate limit uygulanabilir).
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, code, name, isActive]
                properties:
                  id: { type: string }
                  code: { type: string }
                  name: { type: string }
                  isActive: { type: boolean }
                  dealer: { type: object }
        '400': { description: Bad Request }
        '404': { description: Not Found }
        '429': { description: Too Many Requests }

  /api/feedbacks:
    get:
      summary: Geri bildirimler listesi
      description: Oturum açmış kullanıcı (CUSTOMER/DEALER/ADMIN) için filtreli liste. Sayfalama Zod ile (page, pageSize max 100).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: qrCodeId
          in: query
          schema: { type: string }
        - name: sentiment
          in: query
          schema: { type: string }
        - name: needsReview
          in: query
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  feedbacks: { type: array, items: { type: object } }
                  total: { type: integer }
        '401': { description: Unauthorized }

    post:
      summary: Geri bildirim gönder
      description: QR kod ile ilişkili geri bildirim oluşturur. Oturum opsiyonel (anonim feedback desteklenebilir); qrCodeId ve rating zorunlu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qrCodeId, rating]
              properties:
                qrCodeId: { type: string }
                rating: { type: number, minimum: 1, maximum: 5 }
                text: { type: string }
                media: { type: array, items: { type: string } }
                isPublic: { type: boolean, default: true }
                npsScore: { type: number, minimum: 0, maximum: 10, nullable: true }
                utmSource: { type: string }
                utmCampaign: { type: string }
                utmMedium: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  feedback: { type: object }
        '400': { description: Bad Request }
        '404': { description: QR kod bulunamadı }
        '429': { description: Too Many Requests }

  /api/gamification/rewards:
    get:
      summary: Ödül kataloğu
      description: |
        Aktif ödüller listesi. Oturum olmadan çağrılabilir (public katalog).
        Detay için docs/API-REWARDS-GET.md.
      parameters:
        - name: myRewards
          in: query
          schema: { type: string, enum: ['true', 'false'] }
          description: "true ise sadece oturum açan kullanıcının kazandığı ödüller (session gerekli)"
        - name: status
          in: query
          schema: { type: string, enum: ['active', 'inactive'] }
          description: "ADMIN filtre"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { type: object } }
        '401': { description: Unauthorized (myRewards=true için gerekli) }

  /api/customer/stats:
    get:
      summary: Müşteri istatistikleri
      description: Oturum açmış müşteri için özet (puan, rozet, tüketim, trend vb.). Cache-Control önerilir.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: object }
        '401': { description: Unauthorized }

  /api/customer/trends:
    get:
      summary: Müşteri trend verisi
      description: Müşteri tüketim/aktivite trendleri. Cache-Control önerilir.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: object }
        '401': { description: Unauthorized }

  /api/user/profile:
    get:
      summary: Kullanıcı profili
      description: Oturum açmış kullanıcının profil bilgisi (ad, e-posta, adres, işletme alanları vb.).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  user: { type: object }
        '401': { description: Unauthorized }
    patch:
      summary: Profil güncelle
      description: Ad, avatar, işletme adı, adres, dil tercihi vb. güncelleme.
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                image: { type: string }
                businessName: { type: string }
                address: { type: string }
                latitude: { type: number }
                longitude: { type: number }
                preferredLanguage: { type: string }
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }

  /api/partner/v1/digest:
    get:
      summary: Partner özeti (son 24 saat NPS + geri bildirim)
      description: |
        Dış entegrasyon (POS / partner) uç noktası. `Authorization: Bearer qrx_...`, kapsam `read:partner_digest`.
        Kiracı kapsamı anahtardan gelir: bayiye bağlı anahtar yalnız o bayiyi görür (başka `dealerId` → 403);
        partnere bağlı anahtar partnerin bayileriyle sınırlıdır. Anahtar başına dakikada 120 istek (aşımda 429 + Retry-After).
      security: [{ partnerApiKey: [] }]
      parameters:
        - name: dealerId
          in: query
          required: false
          schema: { type: string }
          description: Yalnız platform geneli / partner anahtarlarında süzme için.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [generatedAt, windowHours, dealers]
                properties:
                  generatedAt: { type: string, format: date-time }
                  windowHours: { type: integer, example: 24 }
                  dealers:
                    type: array
                    items:
                      type: object
                      required: [dealerId, label, feedbackCount24h, npsAvg24h, npsResponses24h, avgRating24h]
                      properties:
                        dealerId: { type: string }
                        label: { type: string }
                        feedbackCount24h: { type: integer }
                        npsAvg24h: { type: number, nullable: true }
                        npsResponses24h: { type: integer }
                        avgRating24h: { type: number, nullable: true }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '429': { $ref: '#/components/responses/ApiError' }
        '503': { $ref: '#/components/responses/ApiError' }

  /api/partner/v1/catalog:
    get:
      summary: Partner olay kataloğu ve webhook imza başlıkları
      security: [{ partnerApiKey: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [version, events, webhookHeaders, digestEndpoints]
                properties:
                  version: { type: string, example: '1.0' }
                  events: { type: array, items: { type: object } }
                  webhookHeaders: { type: object }
                  digestEndpoints: { type: object }
        '401': { $ref: '#/components/responses/ApiError' }
        '403': { $ref: '#/components/responses/ApiError' }
        '429': { $ref: '#/components/responses/ApiError' }

components:
  responses:
    ApiError:
      description: |
        Zarf v2 hata gövdesi (lib/http/define-route.ts). `error` Türkçe ve kullanıcıya gösterilebilir;
        istemci davranışı `code` alanına göre seçer. 429'da `Retry-After` başlığı döner.
      content:
        application/json:
          schema:
            type: object
            required: [success, error, code]
            properties:
              ok: { type: boolean, example: false }
              success: { type: boolean, example: false }
              error: { type: string }
              code:
                type: string
                enum: [BAD_REQUEST, VALIDATION, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, RATE_LIMITED, MODULE_DISABLED, INSUFFICIENT_POINTS, TENANT_REQUIRED, SERVICE_UNAVAILABLE, INTERNAL, GONE]
              details: { type: array, items: { type: object } }
              retryable: { type: boolean }
              requestId: { type: string }
  securitySchemes:
    partnerApiKey:
      type: http
      scheme: bearer
      description: Partner API anahtarı (`qrx_` önekli; yönetici Entegrasyon Merkezi'nde üretir).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: NextAuth session cookie veya Bearer token (entegrasyon)
