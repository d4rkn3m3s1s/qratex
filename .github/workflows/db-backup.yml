# Günlük şifreli veritabanı yedeği (arka plan denetimi O9).
#
# Eskiden zamanlama bir geliştirici makinesine (Windows Görev Zamanlayıcı) bağlıydı: makine
# kapalıysa yedek alınmıyor, haber veren de olmuyordu. Bu iş GitHub'ın runner'ında pg_dump 17
# ile `scripts/db-backup.mjs`'i çalıştırır: AES-256-GCM şifreleme + AYRI özel R2 kovası +
# yükleme öncesi doğrulama + heartbeat (betik başarısızlıkta `<HEARTBEAT>/fail` pingler).
#
# AÇMAK İÇİN (proje sahibi, bir kez): Settings → Secrets and variables → Actions
#   Variables: BACKUP_ENABLED=true  (yoksa iş hiç çalışmaz — opt-in)
#              PG_MAJOR=17          (opsiyonel; Neon sunucu sürümüyle aynı ya da yeni olmalı)
#   Secrets:   BACKUP_DATABASE_URL  (pooler'sız DIRECT adres; salt okunur rol önerilir)
#              BACKUP_ENCRYPTION_KEY, BACKUP_R2_ACCOUNT_ID, BACKUP_R2_ACCESS_KEY_ID,
#              BACKUP_R2_SECRET_ACCESS_KEY, BACKUP_R2_BUCKET, BACKUP_R2_PREFIX (ops.),
#              BACKUP_HEARTBEAT_URL (healthchecks.io vb. — yedek alınmayan gün alarm)
# Ayrıntı: scripts/db-backup.README.md
name: DB Yedek (günlük, şifreli)

on:
  schedule:
    - cron: '30 0 * * *' # 00:30 UTC = 03:30 TSİ (günlük orkestratörden önce, trafiğin en az olduğu saat)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: pg_dump → şifrele → özel R2
    if: ${{ vars.BACKUP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PG_MAJOR: ${{ vars.PG_MAJOR || '17' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      # Yalnız betiklerin ihtiyacı (S3 istemcisi); prisma generate (postinstall) gerekmez.
      - name: Bağımlılıklar
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: pg_dump ${{ env.PG_MAJOR }} (PGDG)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${PG_MAJOR}"
          "/usr/lib/postgresql/${PG_MAJOR}/bin/pg_dump" --version

      - name: Yedek al
        env:
          PG_DUMP_PATH: /usr/lib/postgresql/${{ env.PG_MAJOR }}/bin/pg_dump
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_R2_ACCOUNT_ID: ${{ secrets.BACKUP_R2_ACCOUNT_ID }}
          BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          BACKUP_R2_BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
          BACKUP_R2_PREFIX: ${{ secrets.BACKUP_R2_PREFIX }}
          BACKUP_HEARTBEAT_URL: ${{ secrets.BACKUP_HEARTBEAT_URL }}
        run: node scripts/db-backup.mjs
