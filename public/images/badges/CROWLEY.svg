<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1417.32 1417.32" role="img" aria-label="Crowley rozeti">
  <defs>
    <radialGradient id="cro-bg" cx="50%" cy="40%" r="72%">
      <stop offset="0%" stop-color="#1e2a1c"/>
      <stop offset="60%" stop-color="#141d16"/>
      <stop offset="100%" stop-color="#0a0d0a"/>
    </radialGradient>
    <linearGradient id="cro-ring" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8534a"/>
      <stop offset="50%" stop-color="#b0241d"/>
      <stop offset="100%" stop-color="#6e120e"/>
    </linearGradient>
    <linearGradient id="cro-snake" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8fd66b"/>
      <stop offset="55%" stop-color="#3f9b2f"/>
      <stop offset="100%" stop-color="#1f5c18"/>
    </linearGradient>
    <radialGradient id="cro-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="70%" stop-color="#f4b83e"/>
      <stop offset="100%" stop-color="#c47a10"/>
    </radialGradient>
    <filter id="cro-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Madalyon zemin + çerçeve -->
  <circle cx="708.66" cy="708.66" r="690" fill="url(#cro-bg)"/>
  <circle cx="708.66" cy="708.66" r="690" fill="none" stroke="url(#cro-ring)" stroke-width="34"/>
  <circle cx="708.66" cy="708.66" r="632" fill="none" stroke="#b0241d" stroke-width="4" opacity="0.5"/>

  <!-- Işıyan güneş (kaotik-melek/şeytan dengesi) -->
  <g filter="url(#cro-glow)">
    <circle cx="708.66" cy="708.66" r="150" fill="url(#cro-sun)" opacity="0.28"/>
  </g>

  <!-- Kıvrılan yılan (Crowley teması) -->
  <g fill="none" stroke="url(#cro-snake)" stroke-width="46" stroke-linecap="round">
    <path d="M560 980
      C 470 900, 470 760, 590 720
      C 720 676, 760 560, 660 496
      C 580 444, 600 356, 700 344"/>
  </g>
  <!-- Yılan başı -->
  <g fill="url(#cro-snake)" stroke="#1f5c18" stroke-width="8">
    <path d="M700 300
      c 46 0 82 30 82 66
      c 0 30 -22 52 -50 60
      c 22 6 40 22 40 44
      c 0 -6 -34 -18 -54 -12
      c -34 10 -70 -14 -70 -54
      c 0 -60 30 -104 52 -104 Z"/>
  </g>
  <!-- Çatal dil -->
  <path d="M654 330 l -46 -8 24 14 -24 12 46 -6 z" fill="#e8534a"/>
  <!-- Yılan gözü (sarı, dikey pupil) -->
  <ellipse cx="726" cy="352" rx="15" ry="15" fill="#f4d03f"/>
  <ellipse cx="726" cy="352" rx="4" ry="12" fill="#0a0d0a"/>

  <!-- Güneş gözlüğü motifi (Crowley'nin imzası) — alt merkez -->
  <g fill="#0d0d0d" stroke="#b0241d" stroke-width="6">
    <rect x="560" y="800" width="120" height="72" rx="18"/>
    <rect x="738" y="800" width="120" height="72" rx="18"/>
    <path d="M680 828 q 29 -22 58 0" fill="none" stroke="#b0241d" stroke-width="10"/>
  </g>
  <rect x="574" y="812" width="90" height="20" rx="8" fill="#e8534a" opacity="0.55"/>
  <rect x="752" y="812" width="90" height="20" rx="8" fill="#e8534a" opacity="0.55"/>
</svg>
